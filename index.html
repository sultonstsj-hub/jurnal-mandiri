<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mas Arfa Sang Juara</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
        }
        .font-header { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Shading Foto Profesional */
        .profile-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .card-pro {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        
        .card-pro:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.04);
        }

        .btn-check.active {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }

        .task-done {
            background-color: #f1f5f9;
            opacity: 0.8;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top Navigation / Header -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="foto-anak.png" class="profile-small" alt="Profile">
                <div>
                    <h2 class="font-header text-lg font-extrabold text-slate-800">Sang Juara</h2>
                    <p id="currentDate" class="text-[11px] text-slate-400 font-medium uppercase tracking-tighter"></p>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[10px] font-bold text-slate-400 uppercase">Progress</div>
                <div class="text-xl font-bold text-blue-600" id="progressText">0%</div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8 mt-4">
        
        <!-- Kolom Kiri: Ibadah & Progress -->
        <div class="lg:col-span-1 space-y-6">
            <section class="card-pro rounded-3xl p-6">
                <h3 class="font-header text-sm font-bold mb-5 flex items-center gap-2">
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg">🕌</span> Sholat 5 Waktu
                </h3>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="toggleSholat(this, 'Subuh')" class="sholat-item flex justify-between items-center p-3 rounded-xl border border-slate-100 hover:bg-slate-50 font-semibold text-xs text-slate-600 transition-all">
                        Subuh <span>⚪</span>
                    </button>
                    <button onclick="toggleSholat(this, 'Dzuhur')" class="sholat-item flex justify-between items-center p-3 rounded-xl border border-slate-100 hover:bg-slate-50 font-semibold text-xs text-slate-600 transition-all">
                        Dzuhur <span>⚪</span>
                    </button>
                    <button onclick="toggleSholat(this, 'Ashar')" class="sholat-item flex justify-between items-center p-3 rounded-xl border border-slate-100 hover:bg-slate-50 font-semibold text-xs text-slate-600 transition-all">
                        Ashar <span>⚪</span>
                    </button>
                    <button onclick="toggleSholat(this, 'Maghrib')" class="sholat-item flex justify-between items-center p-3 rounded-xl border border-slate-100 hover:bg-slate-50 font-semibold text-xs text-slate-600 transition-all">
                        Maghrib <span>⚪</span>
                    </button>
                    <button onclick="toggleSholat(this, 'Isya')" class="sholat-item flex justify-between items-center p-3 rounded-xl border border-slate-100 hover:bg-slate-50 font-semibold text-xs text-slate-600 transition-all">
                        Isya <span>⚪</span>
                    </button>
                </div>
            </section>

            <div class="hidden lg:block card-pro rounded-3xl p-6 bg-slate-900 text-white">
                <p class="text-xs text-slate-400 mb-2">Kata Bijak Hari Ini</p>
                <p class="italic text-sm">"Disiplin adalah jembatan antara cita-cita dan pencapaian."</p>
            </div>
        </div>

        <!-- Kolom Tengah: Checklist Utama -->
        <div class="lg:col-span-2 space-y-4">
            <h3 class="font-header text-sm font-bold text-slate-500 uppercase tracking-widest px-2">Daftar Kemandirian</h3>
            
            <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Task Items -->
                <div onclick="toggleTask(this, 'Bangun & Rapikan Kasur')" class="card-pro rounded-2xl p-5 cursor-pointer flex items-center gap-4 transition-all">
                    <div class="icon-box p-3 bg-orange-50 rounded-xl text-xl">☀️</div>
                    <div class="flex-1">
                        <p class="font-bold text-sm text-slate-700">Rapikan Kasur</p>
                        <p class="text-[10px] text-slate-400">Kemandirian Pagi</p>
                    </div>
                </div>

                <div onclick="toggleTask(this, 'Mengaji')" class="card-pro rounded-2xl p-5 cursor-pointer flex items-center gap-4 transition-all">
                    <div class="icon-box p-3 bg-emerald-50 rounded-xl text-xl">📖</div>
                    <div class="flex-1">
                        <p class="font-bold text-sm text-slate-700">Mengaji</p>
                        <p class="text-[10px] text-slate-400">Ibadah Harian</p>
                    </div>
                </div>

                <div onclick="toggleTask(this, 'Belajar & Kerjakan PR')" class="card-pro rounded-2xl p-5 cursor-pointer flex items-center gap-4 transition-all">
                    <div class="icon-box p-3 bg-blue-50 rounded-xl text-xl">📚</div>
                    <div class="flex-1">
                        <p class="font-bold text-sm text-slate-700">Belajar & PR</p>
                        <p class="text-[10px] text-slate-400">Prestasi Akademik</p>
                    </div>
                </div>

                <div onclick="toggleTask(this, 'Menabung Hari Ini')" class="card-pro rounded-2xl p-5 cursor-pointer flex items-center gap-4 transition-all">
                    <div class="icon-box p-3 bg-yellow-50 rounded-xl text-xl">💰</div>
                    <div class="flex-1">
                        <p class="font-bold text-sm text-slate-700">Menabung</p>
                        <p class="text-[10px] text-slate-400">Manajemen Uang</p>
                    </div>
                </div>
            </div>

            <!-- Notes & Submit -->
            <div class="mt-8 card-pro rounded-3xl p-6 bg-white shadow-sm">
                <label class="block text-sm font-bold text-slate-700 mb-3">Evaluasi Hari Ini</label>
                <textarea id="catatan" rows="3" class="w-full bg-slate-50 border border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-blue-300 transition-all" placeholder="Tuliskan pengalaman atau hambatanmu hari ini..."></textarea>
                
                <div class="flex flex-col sm:flex-row gap-3 mt-6">
                    <button onclick="sendReport('ayah')" class="flex-1 bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition-all text-xs tracking-widest shadow-lg">LAPOR KE AYAH</button>
                    <button onclick="sendReport('bunda')" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition-all text-xs tracking-widest shadow-lg">LAPOR KE BUNDA</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const NO_AYAH = "6282234588450"; 
        const NO_BUNDA = "6285215798833"; 

        let tasks = [];
        let prayers = [];
        const totalItems = 9;

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', { 
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        function toggleTask(el, name) {
            el.classList.toggle('task-done');
            el.classList.toggle('border-blue-500');
            if (el.classList.contains('task-done')) {
                if(!tasks.includes(name)) tasks.push(name);
            } else {
                tasks = tasks.filter(t => t !== name);
            }
            updateUI();
        }

        function toggleSholat(el, name) {
            el.classList.toggle('active');
            const icon = el.querySelector('span');
            if (el.classList.contains('active')) {
                if(!prayers.includes(name)) prayers.push(name);
                icon.innerText = "✅";
            } else {
                prayers = prayers.filter(p => p !== name);
                icon.innerText = "⚪";
            }
            updateUI();
        }

        function updateUI() {
            const total = tasks.length + prayers.length;
            const percentage = Math.round((total / totalItems) * 100);
            document.getElementById('progressText').innerText = percentage + "%";
        }

        function sendReport(target) {
            const num = (target === 'ayah') ? NO_AYAH : NO_BUNDA;
            const note = document.getElementById('catatan').value;
            let msg = `*📊 DASHBOARD MANDIRI JUARA*\n\n`;
            msg += `*Pencapaian Harian:*\n${tasks.map(t => "✅ " + t).join('\n') || '_Belum ada tugas_'}\n\n`;
            msg += `*Ibadah Sholat:*\n${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(s => prayers.includes(s) ? "✅ "+s : "❌ "+s).join('\n')}\n\n`;
            msg += `*Catatan:* ${note || '-'}\n\n`;
            msg += `*Total Progress: ${document.getElementById('progressText').innerText}*`;
            window.open(`https://wa.me{num}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
