<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Mas Arfa</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .task-card, .sholat-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .done { 
            background: #ecfdf5 !important; 
            border-color: #10b981 !important; 
            transform: scale(0.98);
        }
        .header-gradient {
            background: linear-gradient(180deg, #1e40af 0%, #3b82f6 100%);
            border-radius: 0 0 50px 50px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header Section -->
    <div class="header-gradient pt-10 pb-20 px-6 shadow-2xl relative text-center">
        <div class="max-w-md mx-auto">
            <!-- Foto Anak Hebat -->
            <div class="relative inline-block mb-4">
                <!-- GANTI URL DI BAWAH DENGAN LINK FOTO ANAK ANDA -->
                <img src="foto-anak.png" class="profile-img mx-auto" alt="Anak Hebat">
                <div class="absolute -bottom-2 -right-2 bg-yellow-400 text-[10px] font-extrabold p-1 rounded-full px-2 shadow-lg">🎓 PRO</div>
            </div>
            
            <h1 class="text-white text-2xl font-extrabold tracking-tight">Sang Juara Mandiri</h1>
            <p id="currentDate" class="text-blue-100 text-sm font-medium opacity-80 mt-1"></p>
            
            <!-- Progress Bar Kecil -->
            <div class="mt-6 max-w-[200px] mx-auto bg-white/20 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-yellow-400 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p class="text-white text-[10px] mt-2 font-bold tracking-widest uppercase">Progress: <span id="progressText">0%</span></p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-md mx-auto -mt-10 px-5 space-y-5">
        
        <!-- Task List -->
        <div id="taskList" class="space-y-3">
            <!-- Sholat 5 Waktu Card -->
            <div class="bg-white rounded-3xl shadow-xl p-5 border-b-4 border-blue-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">🕌 Sholat 5 Waktu</h3>
                </div>
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="toggleSholat(this, 'Subuh')" class="sholat-btn bg-slate-50 py-3 rounded-xl border border-slate-100 text-[9px] font-black text-slate-400">SUB</button>
                    <button onclick="toggleSholat(this, 'Dzuhur')" class="sholat-btn bg-slate-50 py-3 rounded-xl border border-slate-100 text-[9px] font-black text-slate-400">DZU</button>
                    <button onclick="toggleSholat(this, 'Ashar')" class="sholat-btn bg-slate-50 py-3 rounded-xl border border-slate-100 text-[9px] font-black text-slate-400">ASH</button>
                    <button onclick="toggleSholat(this, 'Maghrib')" class="sholat-btn bg-slate-50 py-3 rounded-xl border border-slate-100 text-[9px] font-black text-slate-400">MAG</button>
                    <button onclick="toggleSholat(this, 'Isya')" class="sholat-btn bg-slate-50 py-3 rounded-xl border border-slate-100 text-[9px] font-black text-slate-400">ISY</button>
                </div>
            </div>

            <!-- Tugas Lainnya -->
            <button onclick="toggle(this, 'Bangun & Rapikan Kasur')" class="task-card w-full bg-white p-5 rounded-3xl shadow-lg flex items-center justify-between border-b-4 border-transparent">
                <span class="font-bold text-slate-700 text-sm">☀️ Bangun & Rapikan Kasur</span>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-100 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Mengaji')" class="task-card w-full bg-white p-5 rounded-3xl shadow-lg flex items-center justify-between border-b-4 border-transparent">
                <span class="font-bold text-slate-700 text-sm">📖 Mengaji Sore</span>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-100 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Belajar & PR')" class="task-card w-full bg-white p-5 rounded-3xl shadow-lg flex items-center justify-between border-b-4 border-transparent">
                <span class="font-bold text-slate-700 text-sm">📚 Belajar & Kerjakan PR</span>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-100 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Menabung')" class="task-card w-full bg-white p-5 rounded-3xl shadow-lg flex items-center justify-between border-b-4 border-transparent">
                <span class="font-bold text-slate-700 text-sm">💰 Menabung Hari Ini</span>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-100 flex items-center justify-center text-transparent">✓</div>
            </button>
        </div>

        <!-- Notes -->
        <div class="bg-white p-6 rounded-[40px] shadow-2xl space-y-4">
            <textarea id="catatan" rows="2" class="w-full bg-slate-50 p-4 rounded-2xl border-none focus:ring-2 focus:ring-blue-400 outline-none text-sm font-medium text-slate-600" placeholder="Apa pencapaian hebatmu?"></textarea>
            
            <div class="flex gap-2">
                <button onclick="kirimLaporan('ayah')" class="flex-1 bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-xs tracking-widest">LAPOR AYAH</button>
                <button onclick="kirimLaporan('bunda')" class="flex-1 bg-pink-500 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-xs tracking-widest">LAPOR BUNDA</button>
            </div>
        </div>
    </div>

    <script>
        const NO_AYAH = "6282234588450"; 
        const NO_BUNDA = "6285215798833"; 

        let doneTasks = [];
        let doneSholat = [];
        const totalItems = 9; // 4 tugas + 5 sholat

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

        function toggle(el, taskName) {
            el.classList.toggle('done');
            const check = el.querySelector('.check-circle');
            if (el.classList.contains('done')) {
                if(!doneTasks.includes(taskName)) doneTasks.push(taskName);
                check.classList.replace('border-slate-100', 'bg-green-500');
                check.classList.replace('text-transparent', 'text-white');
            } else {
                doneTasks = doneTasks.filter(t => t !== taskName);
                check.classList.replace('bg-green-500', 'border-slate-100');
                check.classList.replace('text-white', 'text-transparent');
            }
            updateProgress();
        }

        function toggleSholat(el, waktu) {
            el.classList.toggle('bg-green-500');
            el.classList.toggle('text-white');
            el.classList.toggle('border-green-600');
            if (el.classList.contains('bg-green-500')) {
                if(!doneSholat.includes(waktu)) doneSholat.push(waktu);
            } else {
                doneSholat = doneSholat.filter(s => s !== waktu);
            }
            updateProgress();
        }

        function updateProgress() {
            const count = doneTasks.length + doneSholat.length;
            const percent = Math.round((count / totalItems) * 100);
            document.getElementById('progressText').innerText = percent + "%";
            document.getElementById('progressBar').style.width = percent + "%";
        }

        function kirimLaporan(penerima) {
            const nomor = (penerima === 'ayah') ? NO_AYAH : NO_BUNDA;
            const catatan = document.getElementById('catatan').value;
            let pesan = `*🏆 JURNAL ANAK HEBAT 🏆*\n\n`;
            pesan += `*Tugas Selesai:*\n${doneTasks.map(t => "✅ " + t).join('\n')}\n\n`;
            pesan += `*Ibadah Sholat:*\n${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(s => doneSholat.includes(s) ? "✅ "+s : "❌ "+s).join('\n')}\n\n`;
            pesan += `*Catatan:* ${catatan || 'Anak hebat mandiri!'}\n`;
            pesan += `*Progress: ${document.getElementById('progressText').innerText}*`;
            window.open(`https://wa.me{nomor}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
