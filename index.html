<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mas Arfa Sang Juara</title>
<!-- Link Tailwind CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter&family=Plus+Jakarta+Sans&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #0f172a;
    --accent: #3b82f6;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #fce4ec);
    color: #1e293b;
  }
  /* Custom scrollbar for better UI */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
  }
</style>
</head>
<body class="min-h-screen font-sans">

<!-- Header -->
<nav class="bg-white bg-opacity-80 backdrop-blur-lg shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="foto-anak.png" class="w-12 h-12 rounded-full border-2 border-white shadow-lg object-cover" alt="Profile" />
      <div>
        <h2 class="text-xl font-semibold text-gray-800">Arfa Sang Juara</h2>
        <p id="currentDate" class="text-xs text-gray-500 uppercase tracking-tight"></p>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs font-semibold text-gray-500 uppercase mb-1">Progress</div>
      <div id="progressText" class="text-2xl font-bold text-blue-600">0%</div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8 mt-4">

  <!-- Kolom Kiri: Ibadah & Progress -->
  <div class="lg:col-span-1 space-y-6">
    <!-- Sholat & Doa -->
    <section class="bg-white bg-opacity-80 backdrop-blur-lg rounded-3xl shadow-lg p-6">
      <h3 class="flex items-center gap-2 mb-4 text-lg font-semibold text-gray-700">
        <span class="bg-blue-100 text-blue-600 rounded-full p-2 text-xl">🕌</span> Sholat 5 Waktu
      </h3>
      <div class="flex flex-col gap-3">
        <!-- Button Sholat -->
        <button onclick="toggleSholat(this, 'Subuh')" class="w-full flex justify-between items-center p-3 rounded-xl border border-gray-200 hover:bg-blue-50 transition duration-200 font-semibold text-sm text-gray-700">
          Subuh <span class="w-6 h-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white transition-all" id="icon-Subuh">⚪</span>
        </button>
        <button onclick="toggleSholat(this, 'Dzuhur')" class="w-full flex justify-between items-center p-3 rounded-xl border border-gray-200 hover:bg-blue-50 transition duration-200 font-semibold text-sm text-gray-700">
          Dzuhur <span class="w-6 h-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white transition-all" id="icon-Dzuhur">⚪</span>
        </button>
        <button onclick="toggleSholat(this, 'Ashar')" class="w-full flex justify-between items-center p-3 rounded-xl border border-gray-200 hover:bg-blue-50 transition duration-200 font-semibold text-sm text-gray-700">
          Ashar <span class="w-6 h-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white transition-all" id="icon-Ashar">⚪</span>
        </button>
        <button onclick="toggleSholat(this, 'Maghrib')" class="w-full flex justify-between items-center p-3 rounded-xl border border-gray-200 hover:bg-blue-50 transition duration-200 font-semibold text-sm text-gray-700">
          Maghrib <span class="w-6 h-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white transition-all" id="icon-Maghrib">⚪</span>
        </button>
        <button onclick="toggleSholat(this, 'Isya')" class="w-full flex justify-between items-center p-3 rounded-xl border border-gray-200 hover:bg-blue-50 transition duration-200 font-semibold text-sm text-gray-700">
          Isya <span class="w-6 h-6 flex items-center justify-center rounded-full border-2 border-gray-300 bg-white transition-all" id="icon-Isya">⚪</span>
        </button>
      </div>
    </section>

    <!-- Kata Bijak -->
    <div class="hidden lg:block bg-gray-100 bg-opacity-70 backdrop-blur-lg rounded-3xl shadow-lg p-6 text-center text-gray-700">
      <p class="text-xs mb-2 font-semibold uppercase">Kata Bijak Hari Ini</p>
      <p class="italic text-sm">"Disiplin adalah jembatan antara cita-cita dan pencapaian."</p>
    </div>
  </div>

  <!-- Kolom Tengah & Kanan: Checklist & Evaluasi -->
  <div class="lg:col-span-2 space-y-6">
    <!-- Daftar Kemandirian -->
    <div class="bg-white bg-opacity-80 backdrop-blur-lg rounded-3xl shadow-lg p-6">
      <h3 class="text-sm font-semibold text-gray-600 uppercase mb-4 tracking-widest">Daftar Kemandirian</h3>
      <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Task Item -->
        <div onclick="toggleTask(this, 'Bangun & Rapikan Kasur')" class="cursor-pointer bg-white rounded-xl p-4 flex items-center gap-3 shadow hover:shadow-lg transition">
          <div class="bg-orange-100 p-3 rounded-xl text-xl">☀️</div>
          <div>
            <p class="font-bold text-sm text-gray-700">Rapikan Kasur</p>
            <p class="text-[10px] text-gray-500">Kemandirian Pagi</p>
          </div>
        </div>
        <div onclick="toggleTask(this, 'Mengaji')" class="cursor-pointer bg-white rounded-xl p-4 flex items-center gap-3 shadow hover:shadow-lg transition">
          <div class="bg-emerald-100 p-3 rounded-xl text-xl">📖</div>
          <div>
            <p class="font-bold text-sm text-gray-700">Mengaji</p>
            <p class="text-[10px] text-gray-500">Ibadah Harian</p>
          </div>
        </div>
        <div onclick="toggleTask(this, 'Belajar & Kerjakan PR')" class="cursor-pointer bg-white rounded-xl p-4 flex items-center gap-3 shadow hover:shadow-lg transition">
          <div class="bg-blue-50 p-3 rounded-xl text-xl">📚</div>
          <div>
            <p class="font-bold text-sm text-gray-700">Belajar & PR</p>
            <p class="text-[10px] text-gray-500">Prestasi Akademik</p>
          </div>
        </div>
        <div onclick="toggleTask(this, 'Menabung Hari Ini')" class="cursor-pointer bg-white rounded-xl p-4 flex items-center gap-3 shadow hover:shadow-lg transition">
          <div class="bg-yellow-100 p-3 rounded-xl text-xl">💰</div>
          <div>
            <p class="font-bold text-sm text-gray-700">Menabung</p>
            <p class="text-[10px] text-gray-500">Manajemen Uang</p>
          </div>
        </div>
      </div>

      <!-- Evaluasi Harian -->
      <div class="mt-8 bg-gray-50 rounded-3xl p-6 shadow-lg">
        <label class="block mb-2 text-sm font-semibold text-gray-700">Ceritakan atau Evaluasi Hari Ini</label>
        <textarea id="catatan" rows="4" placeholder="Tuliskan pengalaman atau hambatanmu hari ini..." class="w-full p-4 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition"></textarea>
        <div class="mt-4 flex flex-col sm:flex-row gap-3">
          <button onclick="sendReport('ayah')" class="flex-1 bg-gray-900 text-white font-semibold py-3 rounded-xl hover:bg-black transition">Lapor ke Ayah</button>
          <button onclick="sendReport('bunda')" class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition">Lapor ke Bunda</button>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- Script -->
<script>
  const NO_AYAH = "6282234588450"; 
  const NO_BUNDA = "6285215798833"; 

  let tasks = [];
  let prayers = [];
  const totalItems = 9;

  // Update tanggal hari ini
  document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', { 
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  function toggleTask(el, name) {
    el.classList.toggle('bg-blue-100');
    if (el.classList.contains('bg-blue-100')) {
      if (!tasks.includes(name)) tasks.push(name);
    } else {
      tasks = tasks.filter(t => t !== name);
    }
    updateUI();
  }

  function toggleSholat(el, name) {
    const iconSpan = el.querySelector('span');
    el.classList.toggle('border-blue-500');
    el.classList.toggle('bg-blue-50');
    if (el.classList.contains('border-blue-500')) {
      if (!prayers.includes(name)) prayers.push(name);
      iconSpan.innerText = "✅";
    } else {
      prayers = prayers.filter(p => p !== name);
      iconSpan.innerText = "⚪";
    }
    updateUI();
  }

  function updateUI() {
    const total = tasks.length + prayers.length;
    const percentage = Math.round((total / totalItems) * 100);
    document.getElementById('progressText').innerText = percentage + "%";
  }

  function sendReport(target) {
    const num = target === 'ayah' ? NO_AYAH : NO_BUNDA;
    const note = document.getElementById('catatan').value;
    let msg = `*📊 BISMILLAH MANDIRI JUARA*\n\n`;
    msg += `*Pencapaian Harian:*\n${tasks.length > 0 ? tasks.map(t => "✅ " + t).join('\n') : '_Belum ada tugas_'}\n\n`;
    msg += `*Ibadah Sholat:*\n${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(s => prayers.includes(s) ? "✅ "+s : "❌ "+s).join('\n')}\n\n`;
    msg += `*Catatan:* ${note || '-'}\n\n`;
    msg += `*Total Progress: ${document.getElementById('progressText').innerText}*`;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
  }
</script>

</body>
</html>
