<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Arfa Hebat</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; }
        .glass-header {
            background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
            border-radius: 0 0 40px 40px;
        }
        .task-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .task-card.active {
            background-color: #ecfdf5;
            border-color: #10b981;
            transform: translateY(2px);
        }
        .sholat-bubble {
            transition: all 0.2s ease;
        }
        .sholat-bubble.active {
            background-color: #10b981;
            color: white;
            border-color: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .profile-border {
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <div class="glass-header pt-12 pb-24 px-6 text-center shadow-xl">
        <div class="max-w-md mx-auto relative">
            <!-- Foto Profil -->
            <div class="relative inline-block mb-6">
                <!-- Ganti link src di bawah dengan path foto anak Anda di GitHub -->
                <img src="foto-anak.png" class="w-28 h-28 rounded-full profile-border object-cover mx-auto bg-white" alt="Juara">
                <div class="absolute -bottom-2 -right-2 bg-yellow-400 text-blue-900 text-[10px] font-extrabold px-3 py-1 rounded-full shadow-lg border-2 border-white">
                    🎓 JUARA
                </div>
            </div>
            <h1 class="text-white text-2xl font-extrabold tracking-tight">Sang Juara Mandiri</h1>
            <p id="currentDate" class="text-blue-100 text-sm mt-1 font-medium"></p>
        </div>
    </div>

    <!-- Stats Floating Card -->
    <div class="max-w-md mx-auto -mt-14 px-6">
        <div class="bg-white rounded-3xl p-5 shadow-xl flex items-center justify-between border border-blue-50">
            <div class="flex flex-col">
                <span class="text-slate-400 text-[10px] font-bold uppercase tracking-wider">Progress Hari Ini</span>
                <span id="progressText" class="text-2xl font-extrabold text-blue-600">0%</span>
            </div>
            <div class="w-32 h-3 bg-slate-100 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-blue-500 transition-all duration-700" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Main List -->
    <div class="max-w-md mx-auto mt-8 px-6 space-y-4">
        
        <!-- Section: Ibadah -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-slate-800 font-bold mb-4 flex items-center gap-2">🕌 Sholat 5 Waktu</h2>
            <div class="grid grid-cols-5 gap-2">
                <button onclick="toggleSholat(this, 'Subuh')" class="sholat-bubble h-12 rounded-2xl border-2 border-slate-100 bg-slate-50 text-[10px] font-extrabold text-slate-500">SUB</button>
                <button onclick="toggleSholat(this, 'Dzuhur')" class="sholat-bubble h-12 rounded-2xl border-2 border-slate-100 bg-slate-50 text-[10px] font-extrabold text-slate-500">DZU</button>
                <button onclick="toggleSholat(this, 'Ashar')" class="sholat-bubble h-12 rounded-2xl border-2 border-slate-100 bg-slate-50 text-[10px] font-extrabold text-slate-500">ASH</button>
                <button onclick="toggleSholat(this, 'Maghrib')" class="sholat-bubble h-12 rounded-2xl border-2 border-slate-100 bg-slate-50 text-[10px] font-extrabold text-slate-500">MAG</button>
                <button onclick="toggleSholat(this, 'Isya')" class="sholat-bubble h-12 rounded-2xl border-2 border-slate-100 bg-slate-50 text-[10px] font-extrabold text-slate-500">ISY</button>
            </div>
        </div>

        <!-- Section: Tugas Harian -->
        <div class="space-y-3" id="taskList">
            <button onclick="toggle(this, 'Bangun & Rapikan Kasur')" class="task-card w-full bg-white p-5 rounded-3xl shadow-sm flex items-center justify-between border-2 border-slate-50">
                <div class="flex items-center gap-4">
                    <span class="text-xl">☀️</span>
                    <span class="font-bold text-slate-700 text-sm">Rapikan Kasur</span>
                </div>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Mengaji')" class="task-card w-full bg-white p-5 rounded-3xl shadow-sm flex items-center justify-between border-2 border-slate-50">
                <div class="flex items-center gap-4">
                    <span class="text-xl">📖</span>
                    <span class="font-bold text-slate-700 text-sm">Mengaji</span>
                </div>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Belajar & Kerjakan PR')" class="task-card w-full bg-white p-5 rounded-3xl shadow-sm flex items-center justify-between border-2 border-slate-50">
                <div class="flex items-center gap-4">
                    <span class="text-xl">📚</span>
                    <span class="font-bold text-slate-700 text-sm">Belajar & PR</span>
                </div>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center text-transparent">✓</div>
            </button>
            <button onclick="toggle(this, 'Menabung Hari Ini')" class="task-card w-full bg-white p-5 rounded-3xl shadow-sm flex items-center justify-between border-2 border-slate-50">
                <div class="flex items-center gap-4">
                    <span class="text-xl">💰</span>
                    <span class="font-bold text-slate-700 text-sm">Menabung</span>
                </div>
                <div class="check-circle w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center text-transparent">✓</div>
            </button>
        </div>

        <!-- Notes Area -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <label class="block text-slate-800 font-bold mb-3">Cerita Hebat Hari Ini:</label>
            <textarea id="catatan" class="w-full bg-slate-50 rounded-2xl p-4 text-sm border-none focus:ring-2 focus:ring-blue-500 outline-none" rows="2" placeholder="Tuliskan pengalaman seru hari ini..."></textarea>
            
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="kirimLaporan('ayah')" class="bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs">👨 LAPOR AYAH</button>
                <button onclick="kirimLaporan('bunda')" class="bg-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs">👩 LAPOR BUNDA</button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const NO_AYAH = "6282234588450"; 
        const NO_BUNDA = "6285215798833"; 
        // ------------------

        let doneTasks = [];
        let doneSholat = [];
        const totalItems = 9; 

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', { 
            weekday: 'long', day: 'numeric', month: 'long' 
        });

        function toggle(el, taskName) {
            el.classList.toggle('active');
            const check = el.querySelector('.check-circle');
            if (el.classList.contains('active')) {
                if(!doneTasks.includes(taskName)) doneTasks.push(taskName);
                check.classList.replace('border-slate-200', 'bg-green-500');
                check.classList.replace('text-transparent', 'text-white');
            } else {
                doneTasks = doneTasks.filter(t => t !== taskName);
                check.classList.replace('bg-green-500', 'border-slate-200');
                check.classList.replace('text-white', 'text-transparent');
            }
            updateProgress();
        }

        function toggleSholat(el, waktu) {
            el.classList.toggle('active');
            if (el.classList.contains('active')) {
                if(!doneSholat.includes(waktu)) doneSholat.push(waktu);
            } else {
                doneSholat = doneSholat.filter(s => s !== waktu);
            }
            updateProgress();
        }

        function updateProgress() {
            const count = doneTasks.length + doneSholat.length;
            const percent = Math.round((count / totalItems) * 100);
            document.getElementById('progressText').innerText = percent + "%";
            document.getElementById('progressBar').style.width = percent + "%";
        }

        function kirimLaporan(penerima) {
            const nomor = (penerima === 'ayah') ? NO_AYAH : NO_BUNDA;
            const catatan = document.getElementById('catatan').value;
            let pesan = `*🏆 JURNAL ANAK HEBAT 🏆*\n\n`;
            pesan += `*Progress Hari Ini: ${document.getElementById('progressText').innerText}*\n\n`;
            pesan += `*Tugas Selesai:*\n${doneTasks.map(t => "✅ " + t).join('\n')}\n\n`;
            pesan += `*Ibadah Sholat:*\n${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(s => doneSholat.includes(s) ? "✅ "+s : "❌ "+s).join('\n')}\n\n`;
            pesan += `*Catatan:* ${catatan || 'Alhamdulillah hari yang luar biasa!'}\n`;
            window.open(`https://wa.me{nomor}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
