name: Build Website to APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Web Project Structure
        run: |
          npm init -y
          echo '{"name": "jurnal-mandiri", "version": "1.0.0", "scripts": {"build": "echo web-built"}}' > package.json
          mkdir www
          cp index.html www/
          cp foto-anak.png www/ || true

      - name: Install Capacitor & Build Android
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init "Jurnal Mandiri" "com.jurnal.mandiri" --web-dir=www
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Inject Anti-Conflict Resolution (Fix Duplicate Kotlin Class)
        run: |
          # Menyisipkan aturan pemaksaan versi Kotlin ke file build.gradle utama untuk mengunci dan mencegah konflik pustaka
          echo "subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
          }" >> android/build.gradle

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Website-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
