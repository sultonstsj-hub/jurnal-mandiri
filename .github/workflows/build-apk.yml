name: Build Website to APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Web Project Structure
        run: |
          npm init -y
          # Membuat file package.json minimal yang valid
          echo '{"name": "jurnal-mandiri", "version": "1.0.0", "scripts": {"build": "echo web-built"}}' > package.json
          
          # Membuat folder 'www' dan memindahkan file website ke dalamnya agar disukai oleh Capacitor
          mkdir www
          cp index.html www/
          cp foto-anak.png www/ || true

      - name: Install Capacitor & Build Android
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init "Jurnal Mandiri" "com.jurnal.mandiri" --web-dir=www
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Website-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
